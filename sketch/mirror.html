<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Full Body Scanner</title>
    <style>
        body { 
            background-color: #000; color: #fff; font-family: monospace; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; overflow: hidden; 
        }
        #mirror-container { 
            position: relative; width: 80vw; max-width: 800px; height: 90vh;
            border: 4px solid #333; border-radius: 20px; overflow: hidden;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; justify-content: center;
        }
        #video-feed { 
            position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
        }
        /* The Placeholder Outline */
        #body-outline {
            position: absolute; width: 45%; height: 85%; 
            border: 4px dashed #ff4444; border-radius: 60px 60px 20px 20px;
            z-index: 10; transition: all 0.3s;
        }
        #overlay { 
            position: absolute; bottom: 5%; left: 0; width: 100%; 
            text-align: center; z-index: 20;
        }
        #compliment-text { 
            background: rgba(0, 0, 0, 0.8); padding: 15px 30px; 
            border-radius: 30px; font-size: 2em; font-weight: bold; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.8); display: inline-block;
            transition: color 0.3s;
        }
        /* State Colors */
        .state-align { border-color: #ff4444 !important; }
        .state-measuring { border-color: #ffdd00 !important; box-shadow: 0 0 30px rgba(255,221,0,0.5) inset; }
        .state-result { border-color: #00ffcc !important; box-shadow: 0 0 40px rgba(0,255,204,0.6) inset; background: rgba(0,255,204,0.1); }
    </style>
</head>
<body>
    <div id="mirror-container">
        <img id="video-feed" src="" alt="Camera Feed">
        <div id="body-outline" class="state-align"></div>
        <div id="overlay">
            <div id="compliment-text">CONNECTING...</div>
        </div>
    </div>

    <script>
        const videoFeed = document.getElementById('video-feed');
        const complimentText = document.getElementById('compliment-text');
        const bodyOutline = document.getElementById('body-outline');

        const ws = new WebSocket('ws://localhost:8765');
        
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            if (data.frame) {
                videoFeed.src = 'data:image/jpeg;base64,' + data.frame;
            }

            if (data.message) {
                complimentText.innerText = data.message;
            }
            
            if (data.state) {
                bodyOutline.className = ''; 
                if (data.state === 'ALIGN') {
                    bodyOutline.classList.add('state-align');
                    complimentText.style.color = '#ff4444';
                } else if (data.state === 'MEASURING') {
                    bodyOutline.classList.add('state-measuring');
                    complimentText.style.color = '#ffdd00';
                } else if (data.state === 'RESULT') {
                    bodyOutline.classList.add('state-result');
                    complimentText.style.color = '#00ffcc';
                }
            }
        };
    </script>
</body>
</html>
